name: Build Kernel k65v1 - ZyCromerZ Clang Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download ZyCromerZ Clang
        run: |
          mkdir toolchain
          cd toolchain
          wget https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz
          tar -xf Clang-12.0.1-20230207.tar.gz
          rm Clang-12.0.1-20230207.tar.gz

      - name: Build Kernel
        run: |
          cd kernel
          
          # Path Toolchain
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          
          # Konfigurasi
          ARCH=arm64
          DEFCONFIG=k65v1_64_bsp_defconfig
          
          mkdir -p out
          
          # 1. Generate Config
          make O=out ARCH=$ARCH $DEFCONFIG
          
          # 2. Paksa Aktifkan ThinLTO
          scripts/config --file out/.config -e LTO_CLANG_THIN
          
          # 3. Proses Build Utama
          # Menambahkan flag -Wno-everything (opsi terakhir) jika driver benar-benar kotor
          # Namun kita mulai dengan flag spesifik agar build tetap aman
          PATH="$TC_DIR:$PATH" make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-unused-variable -Wno-unused-function -Wno-format-security -Wno-incompatible-pointer-types -Wno-return-type" \
              V=0

      - name: Check Results
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
             echo "Build Berhasil!"
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
             echo "Build Berhasil (Image.gz)!"
          else
             echo "Build Gagal! Silakan cek log di bagian atas untuk pesan 'error:' yang spesifik."
             exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-k65v1-ZyCromerZ-ThinLTO
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
