name: Build Kernel k65v1 - Proton Clang Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain

      - name: Build Kernel
        run: |
          cd kernel
          
          # Lokasi Toolchain
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          
          # Konfigurasi
          ARCH=arm64
          DEFCONFIG=k65v1_64_bsp_defconfig
          
          mkdir -p out
          
          # 1. Generate Config menggunakan host GCC asli
          make O=out ARCH=$ARCH $DEFCONFIG HOSTCC=gcc HOSTCXX=g++
          
          # 2. Paksa Aktifkan ThinLTO jika didukung
          scripts/config --file out/.config -e LTO_CLANG_THIN
          
          # 3. Proses Build Utama
          # Kuncinya ada pada 'LLVM=1' dan tetap mendefinisikan HOSTCC secara eksplisit
          # Kita tidak memasukkan TC_DIR ke export PATH global, tapi spesifik ke make
          
          PATH="$TC_DIR:$PATH" make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              HOSTLD=ld \
              HOSTLDFLAGS="-L/usr/lib/x86_64-linux-gnu -L/lib/x86_64-linux-gnu" \
              V=0

      - name: Check Results
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
             echo "Build Berhasil!"
          else
             echo "Build Gagal!"
             exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-k65v1-Proton-Final
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
