name: Build Custom Kernel - Proton Clang Optimized

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          # Clone prebuilt binary (depth 1 agar cepat)
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain

      - name: Build Kernel
        run: |
          cd kernel
          
          # Tentukan Path Toolchain
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          
          # Variabel Konfigurasi
          ARCH=arm64
          DEFCONFIG=your_defconfig_file_here # <--- GANTI INI (contoh: mt6765_defconfig)
          
          # Buat direktori output
          mkdir -p out
          
          # 1. Generate Config menggunakan host compiler sistem
          # Kita tidak memasukkan TC_DIR ke PATH di sini untuk menghindari error fixdep/libc
          make O=out ARCH=$ARCH $DEFCONFIG
          
          # 2. Proses Build Utama
          # Kita masukkan TC_DIR ke PATH hanya pada baris perintah make ini saja
          PATH="$TC_DIR:$PATH" make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              V=0

      - name: Check Results
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
             echo "Kernel build successfully!"
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
             echo "Kernel build successfully (Compressed)!"
          else
             echo "Kernel image not found! Check logs above for errors."
             exit 1
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Proton-Kernel-LTO
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
