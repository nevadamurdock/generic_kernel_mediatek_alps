name: Build Kernel k65v1 - ReSukiSU + AnyKernel3 (Full Clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl git patch zip

      - name: Download ZyCromerZ Clang 12
        run: |
          mkdir toolchain
          cd toolchain
          wget https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz
          tar -xf Clang-12.0.1-20230207.tar.gz
          rm Clang-12.0.1-20230207.tar.gz

      - name: Integrate ReSukiSU
        run: |
          cd kernel
          # Menggunakan script setup ReSukiSU
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          
          if [ ! -d "drivers/kernelsu" ]; then
            echo "ERROR: Integrasi ReSukiSU Gagal!"
            exit 1
          fi
          
          # Force link ke Makefile dan Kconfig jika belum ada
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
             echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

      - name: Fix GPU Driver (Compatibility Fix)
        run: |
          # Perbaikan otomatis driver GPU Mediatek untuk Clang 12
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/PVRSRVDevicePreClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePreClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/PVRSRVGetDevicePowerState(ui32RGXDevIdx/PVRSRVGetDevicePowerState((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/MTKWriteBackFreqToRGX(ui32RGXDevIdx/MTKWriteBackFreqToRGX((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/PVRSRVDevicePostClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePostClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' {} +

      - name: Build Kernel
        run: |
          cd kernel
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          ARCH=arm64
          DEFCONFIG=k65v1_64_bsp_defconfig
          
          # --- PEMBERSIHAN TOTAL (MRPROPER) ---
          echo "Menjalankan mrproper dan membersihkan folder out..."
          make ARCH=$ARCH mrproper
          rm -rf out
          mkdir -p out
          
          # 1. Generate Config
          PATH="$TC_DIR:$PATH" make O=out ARCH=$ARCH $DEFCONFIG
          
          # 2. Konfigurasi ReSukiSU & KPROBES
          scripts/config --file out/.config -e LTO_CLANG_THIN
          scripts/config --file out/.config -e KPROBES
          scripts/config --file out/.config -e KPROBE_EVENTS
          scripts/config --file out/.config -e KSU
          
          # 3. Proses Build Utama
          PATH="$TC_DIR:$PATH" make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              DTC_FLAGS="-w" \
              KCFLAGS="-w -fcommon -fno-builtin -Wno-return-type -Wno-implicit-function-declaration" \
              V=0 || \
          (echo "BUILD GAGAL! Menjalankan Verbose Build untuk detail error..." && \
           PATH="$TC_DIR:$PATH" make -j1 O=out ARCH=$ARCH CC=clang LLVM=1 LLVM_IAS=1 V=1)

      - name: Package with AnyKernel3
        if: success()
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git
          
          # Ambil hasil build kernel (Image.gz atau Image)
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          
          # Ambil DTBO jika ada
          [ -f kernel/out/arch/arm64/boot/dtbo.img ] && cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          # Konfigurasi anykernel.sh otomatis untuk MTK 4.19
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/tdrex; |block=/dev/block/platform/bootdevice/by-name/boot; |g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../GusKernel-ReSukiSU-k65v1-Clean.zip *

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GusKernel-Clean-Package
          path: GusKernel-ReSukiSU-k65v1-Clean.zip
