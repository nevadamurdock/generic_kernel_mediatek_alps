name: Build Kernel k65v1 - Clang 12 + Original KernelSU (Legacy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl git patch

      - name: Download ZyCromerZ Clang 12
        run: |
          mkdir toolchain
          cd toolchain
          wget https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz
          tar -xf Clang-12.0.1-20230207.tar.gz
          rm Clang-12.0.1-20230207.tar.gz

      - name: Integrate Original KernelSU (Legacy)
        run: |
          cd kernel
          # Menggunakan script setup resmi untuk integrasi KSU Legacy
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s legacy
          
          # Verifikasi integrasi
          if [ ! -d "drivers/kernelsu" ]; then
            echo "ERROR: Integrasi KernelSU gagal!"
            exit 1
          fi
          echo "KernelSU Original berhasil diintegrasikan."

      - name: Fix GPU Driver (Compatibility Fix)
        run: |
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/PVRSRVDevicePreClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePreClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/PVRSRVGetDevicePowerState(ui32RGXDevIdx/PVRSRVGetDevicePowerState((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/MTKWriteBackFreqToRGX(ui32RGXDevIdx/MTKWriteBackFreqToRGX((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/PVRSRVDevicePostClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePostClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' {} +

      - name: Build Kernel
        run: |
          cd kernel
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          ARCH=arm64
          DEFCONFIG=k65v1_64_bsp_defconfig
          
          # Hapus history build sebelumnya agar bersih
          rm -rf out
          mkdir -p out
          
          # 1. Generate Config
          make O=out ARCH=$ARCH $DEFCONFIG
          
          # 2. Tambahkan Konfigurasi KSU & KPROBES
          scripts/config --file out/.config -e LTO_CLANG_THIN
          scripts/config --file out/.config -e KPROBES
          scripts/config --file out/.config -e KPROBE_EVENTS
          scripts/config --file out/.config -e KSU_KPROBE_HOOKS
          scripts/config --file out/.config -e KSU
          
          # 3. Proses Build Utama
          PATH="$TC_DIR:$PATH" make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              DTC_FLAGS="-w" \
              KCFLAGS="-w -fcommon -fno-builtin" \
              V=0

      - name: Check Results
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ] || [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
              echo "Build Berhasil dengan KernelSU Original!"
          else
              echo "Build Gagal. Cek log untuk error spesifik."
              exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-k65v1-KSU-Original
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
