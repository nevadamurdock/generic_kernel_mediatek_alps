name: Build Custom Kernel - Proton Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libarchive-tools

      - name: Download Proton Clang
        run: |
          mkdir toolchain
          cd toolchain
          # Mengunduh Proton Clang terbaru (Branch: master)
          git clone https://github.com/kdrag0n/proton-clang-build --depth=1 -b master proton-clang

      - name: Build Kernel
        run: |
          cd kernel
          
          # Setup Path Toolchain
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="$TC_DIR/bin:$PATH"
          
          # Variabel Konfigurasi
          ARCH=arm64
          DEFCONFIG=your_defconfig_file_here # GANTI dengan nama defconfig Anda
          
          # Pre-make (Bersihkan dan Set Defconfig)
          make O=out ARCH=$ARCH clean
          make O=out ARCH=$ARCH $DEFCONFIG
          
          # Proses Build dengan LTO dan Proton Clang
          # Proton Clang sudah membawa binutils terintegrasi (llvm)
          make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              V=0
              
      - name: Check Build Results
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
             echo "Build Berhasil!"
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
             echo "Build Berhasil (Image tanpa DTB)!"
          else
             echo "Build Gagal! Cek Log."
             exit 1
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Proton-Kernel-Build
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
