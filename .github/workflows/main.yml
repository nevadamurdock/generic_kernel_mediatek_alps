name: Build Kernel k65v1 - Clang 12 + KSU Next + SusFS + GPU Fix (Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl git patch

      - name: Download ZyCromerZ Clang 12
        run: |
          mkdir toolchain
          cd toolchain
          wget https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz
          tar -xf Clang-12.0.1-20230207.tar.gz
          rm Clang-12.0.1-20230207.tar.gz

      - name: Integrate KernelSU-Next & SusFS
        run: |
          cd kernel
          # 1. Clone KernelSU-Next (dev-susfs)
          rm -rf drivers/kernelsu
          git clone https://github.com/pershoot/KernelSU-Next -b dev-susfs drivers/kernelsu
          
          # Validasi: Berhenti jika clone gagal
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo "ERROR: KernelSU Kconfig not found! Clone failed."
            exit 1
          fi
          
          # Tambahkan ke Build System dengan pengamanan grep
          if ! grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          # 2. Clone SusFS Source
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs_src
          
          # Cari lokasi file secara dinamis
          SUSFS_H=$(find susfs_src -name susfs.h | head -n 1)
          SUSFS_C=$(find susfs_src -name susfs.c | head -n 1)
          
          [ -f "$SUSFS_H" ] && cp "$SUSFS_H" include/linux/ && echo "Copied susfs.h"
          [ -f "$SUSFS_C" ] && cp "$SUSFS_C" fs/ && echo "Copied susfs.c"
          
          # Terapkan patch KSU-Next
          KSU_PATCH=$(find susfs_src -name "*enable_susfs_for_ksu.patch" | head -n 1)
          if [ -n "$KSU_PATCH" ]; then
            patch -p1 < "$KSU_PATCH" || echo "KSU Patch failed, skipping..."
          fi
          
          # Terapkan patch Filesystem (Semua kecuali patch KSU tadi)
          find susfs_src -name "*.patch" ! -name "*enable_susfs_for_ksu.patch" -exec patch -p1 < {} + || echo "FS patches skipped."

      - name: Fix GPU Driver (Compatibility Fix)
        run: |
          # Cari file mtk_mfgsys.c dimanapun ia berada di folder gpu
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/PVRSRVDevicePreClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePreClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/PVRSRVGetDevicePowerState(ui32RGXDevIdx/PVRSRVGetDevicePowerState((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/MTKWriteBackFreqToRGX(ui32RGXDevIdx/MTKWriteBackFreqToRGX((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          find kernel/drivers/gpu/mediatek -name "mtk_mfgsys.c" -exec sed -i 's/PVRSRVDevicePostClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePostClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' {} +
          echo "GPU driver patched successfully."

      - name: Build Kernel
        run: |
          cd kernel
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          ARCH=arm64
          DEFCONFIG=k65v1_64_bsp_defconfig
          
          mkdir -p out
          
          # 1. Generate Config
          make O=out ARCH=$ARCH $DEFCONFIG
          
          # 2. Konfigurasi KSU, SusFS, & LTO
          scripts/config --file out/.config -e LTO_CLANG_THIN
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KSU_NEXT
          scripts/config --file out/.config -e KSU_SUSFS
          scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
          scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
          
          # 3. Proses Build Utama
          PATH="$TC_DIR:$PATH" make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              DTC_FLAGS="-w" \
              KCFLAGS="-w -fcommon -fno-builtin" \
              V=0

      - name: Check Results
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ] || [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
              echo "Build Berhasil!"
          else
              echo "Build Gagal total. Periksa log kompilasi."
              exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-k65v1-Final
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
