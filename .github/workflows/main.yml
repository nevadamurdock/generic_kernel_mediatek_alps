name: Build Kernel k65v1 - ReSukiSU + SusFS + AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl git patch zip

      - name: Download ZyCromerZ Clang 12
        run: |
          mkdir toolchain
          cd toolchain
          wget https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz
          tar -xf Clang-12.0.1-20230207.tar.gz
          rm Clang-12.0.1-20230207.tar.gz

      - name: Integrate ReSukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          if [ ! -d "drivers/kernelsu" ]; then
            echo "ERROR: Integrasi ReSukiSU Gagal!"
            exit 1
          fi

      - name: Integrate SusFS 4.19
        run: |
          # 1. Clone SusFS Repository (Branch 4.19)
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs
          
          KERNEL_ROOT=${GITHUB_WORKSPACE}/kernel
          SUSFS_ROOT=${GITHUB_WORKSPACE}/susfs
          
          # 2. Salin file pendukung SusFS ke direktori kernel
          cp $SUSFS_ROOT/kernel_patches/fs/* $KERNEL_ROOT/fs/
          cp $SUSFS_ROOT/kernel_patches/include/linux/* $KERNEL_ROOT/include/linux/
          
          # 3. Patch KernelSU untuk mendukung SusFS
          cp $SUSFS_ROOT/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $KERNEL_ROOT/drivers/kernelsu/
          cd $KERNEL_ROOT/drivers/kernelsu
          patch -p1 < 10_enable_susfs_for_ksu.patch
          
          # 4. Patch Kernel Utama
          cd $KERNEL_ROOT
          cp $SUSFS_ROOT/kernel_patches/50_add_susfs_in_kernel-4.19.patch $KERNEL_ROOT/
          patch -p1 < 50_add_susfs_in_kernel-4.19.patch

      - name: Build Kernel
        run: |
          cd kernel
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          PATH="$TC_DIR:$PATH"
          ARCH=arm64
          DEFCONFIG=k65v1_64_bsp_defconfig
          
          # Manual Clean (Anti Error 2)
          rm -rf out
          rm -f .config
          mkdir -p out
          
          make O=out ARCH=$ARCH $DEFCONFIG
          
          # KONFIGURASI PAKSA: KSU + SusFS + Fix LSE
          scripts/config --file out/.config -d ARM64_LSE
          scripts/config --file out/.config -e LTO_CLANG_THIN
          scripts/config --file out/.config -e KPROBES
          scripts/config --file out/.config -e KPROBE_EVENTS
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e SUSFS
          scripts/config --file out/.config -e SUSFS_ROOT_HASH_CHECK
          
          # EKSEKUSI BUILD
          make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              KCFLAGS="-w -fcommon -fno-builtin -Wno-return-type --target=aarch64-linux-gnu -DCONFIG_AS_LSE=0" \
              V=0 || \
          (echo "BUILD GAGAL! Fallback ke GCC Assembler..." && \
           make -j$(nproc --all) O=out ARCH=$ARCH CC=clang LLVM=1 LLVM_IAS=0 KCFLAGS="-w -fcommon --target=aarch64-linux-gnu -DCONFIG_AS_LSE=0")

      - name: Package with AnyKernel3
        if: success()
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git
          [ -f kernel/out/arch/arm64/boot/Image.gz ] && cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          [ -f kernel/out/arch/arm64/boot/Image ] && cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          [ -f kernel/out/arch/arm64/boot/dtbo.img ] && cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/tdrex; |block=/dev/block/platform/bootdevice/by-name/boot; |g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../GusKernel-ReSukiSU-SusFS-k65v1.zip *

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GusKernel-Package
          path: GusKernel-ReSukiSU-SusFS-k65v1.zip
