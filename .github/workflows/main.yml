name: Build Kernel k65v1 - Clang 20 + KernelSU Next (SusFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl git

      - name: Download AOSP Clang 20
        run: |
          mkdir toolchain
          cd toolchain
          wget https://github.com/moonooen/AOSP20/releases/download/v1.0/clang-r547379-qssi.tar.gz
          tar -xf clang-r547379-qssi.tar.gz
          rm clang-r547379-qssi.tar.gz

      - name: Integrate KernelSU-Next
        run: |
          cd kernel
          # Menggunakan curl untuk mengambil script installer KernelSU-Next (cabang dev-susfs)
          # Ini akan otomatis menambahkan driver ke driver/kernelsu dan memodifikasi Kconfig/Makefile
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s dev-susfs
          
          # Catatan: Karena repo pershoot adalah fork, jika setup.sh tiann tidak mendeteksi 
          # dev-susfs di repo utama, kita gunakan metode manual fetch:
          git clone https://github.com/pershoot/KernelSU-Next -b dev-susfs KernelSU-Next-Source
          cp -r KernelSU-Next-Source/kernel drivers/kernelsu
          
          # Tambahkan konfigurasi manual ke Kconfig jika belum ada
          if ! grep -q "CONFIG_KSU" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: Build Kernel
        run: |
          cd kernel
          
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          ARCH=arm64
          DEFCONFIG=k65v1_64_bsp_defconfig
          
          mkdir -p out
          
          # 1. Generate Config
          make O=out ARCH=$ARCH $DEFCONFIG
          
          # 2. Aktifkan KernelSU & ThinLTO
          scripts/config --file out/.config -e LTO_CLANG_THIN
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KSU_NEXT
          # Jika ingin mengaktifkan SusFS secara manual (pastikan patch SusFS sudah masuk jika dibutuhkan)
          scripts/config --file out/.config -e KSU_SUSFS 
          
          # 3. Proses Build Utama
          PATH="$TC_DIR:$PATH" make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              KCFLAGS="-w -fcommon -fno-builtin" \
              V=0

      - name: Check Results
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
              echo "Build Berhasil dengan KernelSU-Next!"
          else
              echo "Build Gagal. Periksa konflik driver di log."
              exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-k65v1-KSU-Next
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
