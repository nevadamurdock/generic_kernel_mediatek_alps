name: Build Kernel k65v1 - Clang 12 + KSU Next + SusFS Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl git patch

      - name: Download ZyCromerZ Clang 12
        run: |
          mkdir toolchain
          cd toolchain
          wget https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz
          tar -xf Clang-12.0.1-20230207.tar.gz
          rm Clang-12.0.1-20230207.tar.gz

      - name: Integrate KernelSU-Next & SusFS
        run: |
          cd kernel
          # 1. Clone KernelSU-Next (dev-susfs)
          git clone https://github.com/pershoot/KernelSU-Next -b dev-susfs drivers/kernelsu
          
          # Tambahkan ke Build System
          if ! grep -q "CONFIG_KSU" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          # 2. Clone SusFS Source
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs_src
          
          # Cari lokasi file secara dinamis agar tidak error "No such file"
          SUSFS_H=$(find susfs_src -name susfs.h | head -n 1)
          SUSFS_C=$(find susfs_src -name susfs.c | head -n 1)
          
          if [ -f "$SUSFS_H" ]; then
            cp "$SUSFS_H" include/linux/
            echo "Successfully copied susfs.h"
          fi
          
          if [ -f "$SUSFS_C" ]; then
            cp "$SUSFS_C" fs/
            echo "Successfully copied susfs.c"
          fi
          
          # Terapkan patch KSU-Next (Mencari patch yang mengaktifkan SusFS di KSU)
          KSU_PATCH=$(find susfs_src -name "*enable_susfs_for_ksu.patch" | head -n 1)
          if [ -n "$KSU_PATCH" ]; then
            patch -p1 < "$KSU_PATCH" || echo "KSU Patch skip (already applied or incompatible)."
          fi
          
          # Terapkan patch Filesystem (Mencari semua file .patch di dalam folder kernel-4.19)
          # Kita filter agar tidak menerapkan patch KSU lagi di langkah ini
          find susfs_src -name "*.patch" ! -name "*enable_susfs_for_ksu.patch" -exec patch -p1 < {} + || echo "Some FS patches skipped."

      - name: Fix GPU Driver (Prevention)
        run: |
          # Melakukan fix pada driver GPU agar aman dari error type conversion
          GPU_FILE="kernel/drivers/gpu/mediatek/gpu_rgx/m1.13ED5776728/services/system/rogue/rgx_mtk/mt6765/mtk_mfgsys.c"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/PVRSRVDevicePreClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePreClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' "$GPU_FILE"
            sed -i 's/PVRSRVGetDevicePowerState(ui32RGXDevIdx/PVRSRVGetDevicePowerState((void *)(uintptr_t)ui32RGXDevIdx/g' "$GPU_FILE"
            sed -i 's/MTKWriteBackFreqToRGX(ui32RGXDevIdx/MTKWriteBackFreqToRGX((void *)(uintptr_t)ui32RGXDevIdx/g' "$GPU_FILE"
            sed -i 's/PVRSRVDevicePostClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePostClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' "$GPU_FILE"
            echo "GPU driver patched successfully."
          fi

      - name: Build Kernel
        run: |
          cd kernel
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          ARCH=arm64
          DEFCONFIG=k65v1_64_bsp_defconfig
          
          mkdir -p out
          make O=out ARCH=$ARCH $DEFCONFIG
          
          # Aktifkan semua fitur
          scripts/config --file out/.config -e LTO_CLANG_THIN
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KSU_NEXT
          scripts/config --file out/.config -e KSU_SUSFS
          scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
          scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
          
          PATH="$TC_DIR:$PATH" make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              DTC_FLAGS="-w" \
              KCFLAGS="-w -fcommon -fno-builtin" \
              V=0

      - name: Check Results
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ] || [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
              echo "Build Sukses!"
          else
              echo "Build Gagal, periksa log build di atas."
              exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-k65v1-Clang12-KSU-SusFS
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
