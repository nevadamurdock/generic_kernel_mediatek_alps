name: Build Kernel k65v1 - ZyCromerZ Clang 12 + KSU Next + SusFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/generic_kernel_mediatek_alps
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libarchive-tools \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl git patch

      - name: Download ZyCromerZ Clang 12
        run: |
          mkdir toolchain
          cd toolchain
          # Link pilihan user: Clang 12.0.1
          wget https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz
          tar -xf Clang-12.0.1-20230207.tar.gz
          rm Clang-12.0.1-20230207.tar.gz

      - name: Integrate KernelSU-Next & SusFS
        run: |
          cd kernel
          # 1. Pasang KernelSU-Next Driver (dev-susfs)
          git clone https://github.com/pershoot/KernelSU-Next -b dev-susfs drivers/kernelsu
          
          # Tambahkan ke Build System
          if ! grep -q "CONFIG_KSU" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          # 2. Unduh dan Terapkan SusFS Patches (Kernel 4.19)
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs_src
          
          # Salin header SusFS ke folder include kernel
          cp susfs_src/kernel/include/linux/susfs.h include/linux/
          cp susfs_src/kernel/fs/susfs.c fs/
          
          # Terapkan Patch ke core kernel
          cp susfs_src/KernelSU/10_enable_susfs_for_ksu.patch .
          patch -p1 < 10_enable_susfs_for_ksu.patch || echo "Patch KSU skip."
          
          # Patch filesystem (SusFS)
          find susfs_src/kernel/ -name "*.patch" -exec patch -p1 < {} + || echo "Patch filesystem skip."

      - name: Fix GPU Driver (Optional for Clang 12)
        run: |
          # Meskipun Clang 12 lebih toleran, kita tetap jalankan sed ini sebagai langkah preventif
          cd kernel/drivers/gpu/mediatek/gpu_rgx/m1.13ED5776728/services/system/rogue/rgx_mtk/mt6765/
          sed -i 's/PVRSRVDevicePreClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePreClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' mtk_mfgsys.c
          sed -i 's/PVRSRVGetDevicePowerState(ui32RGXDevIdx/PVRSRVGetDevicePowerState((void *)(uintptr_t)ui32RGXDevIdx/g' mtk_mfgsys.c
          sed -i 's/MTKWriteBackFreqToRGX(ui32RGXDevIdx/MTKWriteBackFreqToRGX((void *)(uintptr_t)ui32RGXDevIdx/g' mtk_mfgsys.c
          sed -i 's/PVRSRVDevicePostClockSpeedChange(ui32RGXDevIdx/PVRSRVDevicePostClockSpeedChange((void *)(uintptr_t)ui32RGXDevIdx/g' mtk_mfgsys.c

      - name: Build Kernel
        run: |
          cd kernel
          
          TC_DIR="${GITHUB_WORKSPACE}/toolchain/bin"
          ARCH=arm64
          DEFCONFIG=k65v1_64_bsp_defconfig
          
          mkdir -p out
          
          # 1. Generate Config
          make O=out ARCH=$ARCH $DEFCONFIG
          
          # 2. Konfigurasi KSU, SusFS, & LTO
          scripts/config --file out/.config -e LTO_CLANG_THIN
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KSU_NEXT
          scripts/config --file out/.config -e KSU_SUSFS
          scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
          scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
          
          # 3. Proses Build Utama
          # Pada Clang 12, LLVM_IAS=1 mungkin perlu dimatikan jika assembler-nya bermasalah,
          # tapi kita coba aktifkan dulu untuk performa.
          PATH="$TC_DIR:$PATH" make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              DTC_FLAGS="-w" \
              KCFLAGS="-w -fcommon -fno-builtin" \
              V=0

      - name: Check Results
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ] || [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
              echo "Build Berhasil!"
          else
              echo "Build Gagal."
              exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-k65v1-Clang12-KSU
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
